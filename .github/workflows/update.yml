name: Update SOCKS4 Proxy List

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch and update proxies
        run: |
          curl -s "https://raw.githubusercontent.com/r00tee/Proxy-List/main/Socks4.txt" > all.txt
          curl -s "https://raw.githubusercontent.com/ObcbO/getproxy/master/file/socks4.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/TuanMinPay/live-proxy/master/socks4.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/casals-ar/proxy-list/refs/heads/main/socks4" >> all.txt
          curl -s "https://raw.githubusercontent.com/ProxyScraper/ProxyScraper/refs/heads/main/socks4.txt" >> all.txt
          curl -s "https://api.openproxylist.xyz/socks4.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/zevtyardt/proxy-list/main/socks4.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/casa-ls/proxy-list/refs/heads/main/socks4" >> all.txt
          curl -s "https://api.proxyscrape.com/v3/free-proxy-list/get?request=displayproxies&protocol=socks4&proxy_format=ipport&format=text&timeout=20000" >> all.txt
          curl -s "https://raw.githubusercontent.com/databay-labs/free-proxy-list/refs/heads/master/socks4.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/monosans/proxy-list/main/proxies/socks4.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/ClearProxy/checked-proxy-list/main/socks4/raw/all.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/ClearProxy/checked-proxy-list/main/socks4/raw/all.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/officialputuid/ProxyForEveryone/refs/heads/main/socks4/socks4.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/proxifly/free-proxy-list/main/proxies/protocols/socks4/data.txt" >> all.txt   
          curl -s "https://raw.githubusercontent.com/proxygenerator1/ProxyGenerator/refs/heads/main/Stable/socks4.txt" >> all.txt
          curl -s "https://github.com/Anonym0usWork1221/Free-Proxies/raw/refs/heads/main/proxy_files/socks4_proxies.txt" >> all.txt
          curl -s "https://github.com/Thordata/awesome-free-proxy-list/raw/refs/heads/main/proxies/socks4.txt" >> all.txt
          curl -s "https://raw.githubusercontent.com/ALIILAPRO/Proxy/main/socks4.txt" >> all.txt
          curl -s "https://free-proxy-list.net/" >> all.txt
          curl -s "https://raw.githubusercontent.com/vmheaven/VMHeaven-Free-Proxy-Updated/main/socks4.txt" >> all.txt   
          grep -Eo '[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}:[0-9]{2,5}' all.txt | sort -u -o all.txt
          

      - name: Commit and push updated file
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          date -u > timestamp.txt
          git add all.txt timestamp.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update HTTP proxy list and keepalive timestamp" && git push)
